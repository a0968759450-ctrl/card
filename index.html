<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>傳送雕刻部名片</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
         background:#0A1024; color:#F5F3EE; font-family:sans-serif; text-align:center; padding:0 20px; }
  button { font-size:18px; font-weight:bold; padding:14px 28px; border:none; border-radius:10px;
           background:linear-gradient(90deg,#FFC94A,#FF4FB1); color:#0A1024; }
  button:disabled { opacity:.4; }
  #msg { font-size:14px; color:#A9B0C7; }
</style>
</head>
<body>
  <h2>正詠資訊 雕刻部名片</h2>
  <button id="share" disabled>選擇聊天室並傳送</button>
  <div id="msg">載入中…</div>
<script>
  const LIFF_ID = '2012307452-ME8hzG6M';   // ← 下一步拿到 LIFF ID 後只要改這一行
  const ALT_TEXT = '正詠資訊 高雄分公司雕刻部｜聯絡資訊';

  const btn = document.getElementById('share');
  const msg = document.getElementById('msg');
  let card = null;

  // 讀取同一個資料夾裡的 card.json（卡片內容）
  fetch('card.json', { cache: 'no-store' })
    .then(function (res) { return res.json(); })
    .then(function (json) {
      card = json;
      return liff.init({ liffId: LIFF_ID });
    })
    .then(function () {
      if (!liff.isLoggedIn()) { liff.login(); return; }
      if (!liff.isApiAvailable('shareTargetPicker')) {
        msg.textContent = '無法使用分享功能：請更新 LINE，或確認 LIFF 設定已開啟 shareTargetPicker';
        return;
      }
      btn.disabled = false;
      msg.textContent = '';
    })
    .catch(function (err) { msg.textContent = '載入失敗：' + err; });

  btn.addEventListener('click', function () {
    liff.shareTargetPicker(
      [{ type: 'flex', altText: ALT_TEXT, contents: card }],
      { isMultiple: true }
    ).then(function (res) {
      msg.textContent = res ? '已傳送！' : '已取消';
    }).catch(function (err) { msg.textContent = '傳送失敗：' + err; });
  });
</script>
</body>
</html>
